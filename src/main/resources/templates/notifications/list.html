<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lista de Notificacoes</title>
</head>
<body>
<h1>Histórico de Notificações</h1>

<a th:href="@{/notifications/new}">+ Criar nova notificação</a>
<br><br>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Assunto</th>
        <th>Canal</th>
        <th>Estado</th>
        <th>Data Criação</th>
        <th>Acao</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="n : ${notifications}">
        <td th:text="${n.id}">1</td>
        <td th:text="${n.subject}">Assunto</td>
        <td th:text="${n.channelType}">EMAIL</td>
        <td th:text="${n.status}">SENT</td>
        <td th:text="${n.createdAt}">2026-09-28</td>
        <td>
            <a th:href="@{/notifications/{id}(id=${n.id})}">Ver Detalhe</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
